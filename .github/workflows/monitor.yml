name: NTRIP Stream Monitor

on:
  schedule:
    # Trigger every 10 minutes
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib

      - name: Execute 60-Second NTRIP Sample
        run: |
          python ntrip_headless_logger.py

      - name: Commit and push log & updated plot
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add ntrip_reliability_log.csv ntrip_session_summary.png
          git commit -m "Add 60s sample log and update plot [skip ci]" || exit 0
          git push
