name: NTRIP Stream Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib gspread google-auth

      - name: Execute 60-Second NTRIP Sample
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python ntrip_headless_logger.py

      - name: Commit and push updated plots
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # Only committing the images now—no giant CSV files in git!
          git add ntrip_session_summary.png ntrip_overlay_analysis.png
          git commit -m "Update dashboard graphs [skip ci]" || exit 0
          git push
