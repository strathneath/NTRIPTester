name: NTRIP Stream Monitor

on:
  schedule:
    # Trigger automatically every 10 minutes continuously
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib gspread google-auth

      - name: Execute 60-Second NTRIP Sample
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python ntrip_headless_logger.py

      - name: Commit and push updated plots
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add -A
          # Check if any image files changed before committing to prevent exit code 128
          if git diff-index --quiet HEAD --; then
            echo "No visual changes detected in PNG plots. Skipping commit."
          else
            git commit -m "Update dashboard graphs [skip ci]"
            git push
          fi
